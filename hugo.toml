baseURL = 'https://wovenjunct.github.io/'
locale = 'zh-CN'
title = "WovenJunct's Mind Palace"
theme = 'reimu'

enableGitInfo = true

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'

[languages]
[languages.zh-CN]
label = '简体中文'
weight = 1
hasCJKLanguage = true

[markup.goldmark.renderer]
unsafe = true